name: Auto Release APK & IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag override (leave empty to use versionName from app/build.gradle.kts)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-release-lx-pure
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      should_release: ${{ steps.meta.outputs.should_release }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag and check if release already exists
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)"/\1/')
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed -E 's/.*=\s*([0-9]+)/\1/')
          if [ -z "$VERSION" ]; then
            echo "Failed to read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} already exists; workflow_dispatch will rebuild and refresh assets."
            else
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} already exists; skipping auto-release. Bump versionName in app/build.gradle.kts or push a new v* tag to publish."
            fi
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New release detected: ${TAG}"
          fi

  android-build:
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
      cert_sha256: ${{ steps.package.outputs.cert_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/lx-pure-release.jks
            echo "has_keystore=true" >> "$GITHUB_ENV"
          else
            echo "WARNING: RELEASE_KEYSTORE_BASE64 secret not configured; Release APK will fall back to debug signing." >&2
            echo "has_keystore=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ env.has_keystore == 'true' && 'keystore/lx-pure-release.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature and prepare artifact
        id: package
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p android_out
          APK_NAME="lx-pure-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "android_out/${APK_NAME}"

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs "android_out/${APK_NAME}")
          echo "$CERT_INFO"
          CERT_SHA256=$(echo "$CERT_INFO" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          APK_SHA256=$(sha256sum "android_out/${APK_NAME}" | awk '{print $1}')

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-out
          path: android_out/
          retention-days: 1

      - name: Clean up temporary keystore
        if: always()
        run: rm -rf keystore

  ios-build:
    needs: meta
    if: needs.meta.outputs.should_release == 'true'
    runs-on: macos-15
    outputs:
      ipa_name: ${{ steps.package.outputs.ipa_name }}
      ipa_sha256: ${{ steps.package.outputs.ipa_sha256 }}
      ipa_signed_mode: ${{ steps.package.outputs.ipa_signed_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select available iOS Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = []
          for runtime, devs in data.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          candidates.append((runtime, d['name'], d['udid']))
          candidates.sort(key=lambda x: ('iOS-18' in x[0], x[0], x[1]), reverse=True)
          print(candidates[0][2] if candidates else '')
          ")
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=${SIM_ID}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          xcodebuild \
            -project LXPure.xcodeproj \
            -scheme LXPure \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            test

      - name: Build and package iOS IPA
        id: package
        working-directory: ios
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ../ios_out

          if [ -n "$IOS_CERT_P12_BASE64" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            # Optional signed build when Apple distribution certificate & provisioning profile secrets are configured
            KEYCHAIN_PATH=$RUNNER_TEMP/lx-pure-signing.keychain-db
            KEYCHAIN_PASS="lxpure-ci-temp"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
            cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID}.mobileprovision"

            xcodebuild \
              -project LXPure.xcodeproj \
              -scheme LXPure \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              MARKETING_VERSION="${VERSION}" \
              CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
              build

            IPA_NAME="lx-pure-ios-${TAG}-signed.ipa"
            SIGNED_MODE="证书正式签名"
          else
            xcodebuild \
              -project LXPure.xcodeproj \
              -scheme LXPure \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              MARKETING_VERSION="${VERSION}" \
              CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

            IPA_NAME="lx-pure-ios-${TAG}-unsigned.ipa"
            SIGNED_MODE="未签名（Ad-Hoc，支持巨魔 TrollStore / AltStore / SideStore / 自签）"
          fi

          rm -rf build_ipa && mkdir -p build_ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/LXPure.app build_ipa/Payload/LXPure.app
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            codesign --force --deep --sign - build_ipa/Payload/LXPure.app
          fi
          (cd build_ipa && zip -r -y "../../ios_out/${IPA_NAME}" Payload)

          IPA_SHA256=$(shasum -a 256 "../ios_out/${IPA_NAME}" | awk '{print $1}')
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "ipa_sha256=${IPA_SHA256}" >> "$GITHUB_OUTPUT"
          echo "ipa_signed_mode=${SIGNED_MODE}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-out
          path: ios_out/
          retention-days: 1

  publish:
    needs: [meta, android-build, ios-build]
    if: needs.meta.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-out
          path: release_out

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-release-out
          path: release_out

      - name: Generate checksums and release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          APK_NAME: ${{ needs.android-build.outputs.apk_name }}
          APK_SHA256: ${{ needs.android-build.outputs.apk_sha256 }}
          CERT_SHA256: ${{ needs.android-build.outputs.cert_sha256 }}
          IPA_NAME: ${{ needs.ios-build.outputs.ipa_name }}
          IPA_SHA256: ${{ needs.ios-build.outputs.ipa_sha256 }}
          IPA_SIGNED_MODE: ${{ needs.ios-build.outputs.ipa_signed_mode }}
        run: |
          (cd release_out && sha256sum "${APK_NAME}" "${IPA_NAME}" > SHA256SUMS.txt)

          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log -n 10 --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- 常规维护与稳定性优化"
          else
            # Wrap bare @annotations (e.g. @MainActor, @OptIn) in backticks so GitHub does not
            # misinterpret them as @user mentions and pull unrelated accounts into Release Contributors.
            CHANGES=$(printf '%s\n' "$CHANGES" | python3 -c '
          import re, sys
          text = sys.stdin.read()
          parts = re.split(r"(`[^`]*`)", text)
          for i in range(0, len(parts), 2):
              parts[i] = re.sub(r"(?<![A-Za-z0-9_./`])(@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)", r"`\1`", parts[i])
          sys.stdout.write("".join(parts))
          ')
          fi

          cat > release_out/release_notes.md <<EOF
          ## 轻雪音乐 (LX Pure) ${TAG}

          ### 本版变更记录
          ${CHANGES}

          ### 重要提示
          - Android 与 iOS 安装包均为**开源纯净版**，**不内置、不提供、不推荐任何第三方音源脚本或音频资源**。请自行导入合规的 \`.js\` 自定义源或导入本地音频使用。
          - **Android**：使用正式 Release 证书签名，支持直接覆盖升级。
          - **iOS**：${IPA_SIGNED_MODE}，要求 iOS 16.0 及以上，支持通过巨魔（TrollStore）、AltStore、SideStore、Sideloadly 等工具安装，或使用 Xcode 打开 \`ios/\` 自行签名编译。

          ### 校验信息
          - **Android APK**: \`${APK_NAME}\`
            - SHA-256: \`${APK_SHA256}\`
            - 签名证书 SHA-256 指纹: \`${CERT_SHA256}\`
          - **iOS IPA**: \`${IPA_NAME}\`
            - SHA-256: \`${IPA_SHA256}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          APK_NAME: ${{ needs.android-build.outputs.apk_name }}
          IPA_NAME: ${{ needs.ios-build.outputs.ipa_name }}
          RELEASE_EXISTS: ${{ needs.meta.outputs.release_exists }}
        run: |
          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release upload "$TAG" \
              "release_out/${APK_NAME}" \
              "release_out/${IPA_NAME}" \
              release_out/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release_out/release_notes.md
          else
            gh release create "$TAG" \
              "release_out/${APK_NAME}" \
              "release_out/${IPA_NAME}" \
              release_out/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --notes-file release_out/release_notes.md
          fi
